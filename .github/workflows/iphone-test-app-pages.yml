name: Deploy iPhone test app to GitHub Pages

on:
  push:
    branches: [main, master, claude/gifted-shannon-0tho0b]
    paths: ['iphone-test-app/**', '.github/workflows/iphone-test-app-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: iphone-test-app
      - id: deployment
        uses: actions/deploy-pages@v4
