<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="content=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Pain Mapper</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2a3038;
  --txt:#e6edf3; --dim:#8b949e; --accent:#58a6ff;
  --s0:#16a34a; --s1:#84cc16; --s2:#eab308; --s3:#f97316; --s4:#dc2626;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior-y:contain}
body{padding-bottom:calc(12px + var(--safe-b))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:40;background:rgba(13,17,23,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:560px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.brand{font-weight:700;letter-spacing:.2px;font-size:15px;flex:1;display:flex;align-items:center;gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--s0);box-shadow:0 0 10px var(--s0)}
.pill{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--dim);white-space:nowrap}
.pill.on{color:var(--txt);border-color:#3d4650;background:var(--panel2)}
.prog{height:3px;background:#20262e}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--s0),var(--accent));
  width:0;transition:width .35s ease}

/* ---------- generic ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
h1{font-size:24px;line-height:1.25;margin:18px 0 8px}
h2{font-size:17px;margin:22px 0 8px}
h3{font-size:15px;margin:0 0 6px}
p{margin:8px 0}
.dim{color:var(--dim)}
.sm{font-size:13.5px}
.xs{font-size:12.5px}
.center{text-align:center}
.row{display:flex;gap:8px}
.grow{flex:1}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--panel2);
  border:1px solid var(--line);font-weight:600;text-align:center;transition:.12s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(180deg,#1f6feb,#1858c4);border-color:#2b6fd6;color:#fff}
.btn.ghost{background:none}
.btn.sm{padding:10px 14px;font-size:14px;width:auto}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;
  color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:3px 8px}

/* ---------- question ---------- */
.qwrap{padding-top:6px}
.qmeta{display:flex;align-items:center;gap:8px;margin:14px 0 6px;flex-wrap:wrap}
.qtitle{font-size:22px;font-weight:700;line-height:1.3;margin:6px 0 10px}
.qcue{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:10px;padding:13px 14px;font-size:15.5px;color:#cfd8e3}
.qcue b{color:#fff}
.qnote{font-size:13px;color:var(--dim);margin-top:10px}
.qnote.warn{color:#f0b429}

/* scale buttons */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-top:18px}
.sbtn{aspect-ratio:1/1.15;min-width:0;border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;font-weight:800;font-size:28px;
  color:#08120a;border:2px solid rgba(255,255,255,.12);transition:.1s;position:relative;overflow:hidden}
.sbtn small{font-size:9px;font-weight:700;opacity:.78;letter-spacing:0;text-transform:uppercase;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbtn:active{transform:scale(.93)}
.sbtn[data-v="0"]{background:var(--s0)}
.sbtn[data-v="1"]{background:var(--s1)}
.sbtn[data-v="2"]{background:var(--s2)}
.sbtn[data-v="3"]{background:var(--s3);color:#1a0c02}
.sbtn[data-v="4"]{background:var(--s4);color:#fff}
.sbtn.sel{outline:3px solid #fff;outline-offset:2px}
.slabels{display:flex;justify-content:space-between;margin-top:9px;font-size:12px;color:var(--dim)}

/* choice */
.choices{display:grid;gap:10px;margin-top:16px}
.choice{padding:16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.choice b{display:block;font-size:16px}
.choice span{font-size:13px;color:var(--dim)}
.choice.sel{border-color:var(--accent);background:#152234}

/* actions */
.actions{display:flex;gap:8px;margin-top:16px}
.act{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);font-size:13.5px;font-weight:600;color:var(--dim)}
.act.has{color:var(--accent);border-color:#2b4a70}

/* comment sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:none}
.sheet.open{display:block}
.sheet .inner{position:absolute;left:0;right:0;bottom:0;background:var(--panel);
  border-radius:18px 18px 0 0;border-top:1px solid var(--line);
  padding:18px 16px calc(18px + var(--safe-b));max-width:560px;margin:0 auto;
  max-height:88vh;overflow-y:auto}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--txt);border:1px solid var(--line);
  border-radius:12px;padding:12px;font:15px/1.45 inherit;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0}
.chip{font-size:12.5px;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--dim)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%) translateY(20px);
  background:#243447;border:1px solid #35506e;color:#dbe7f5;padding:11px 16px;border-radius:12px;
  font-size:13.5px;max-width:88%;opacity:0;pointer-events:none;transition:.25s;z-index:80;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- results ---------- */
.hyp{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:var(--panel)}
.hyp .top{display:flex;align-items:baseline;gap:10px}
.hyp .nm{font-weight:700;font-size:16px;flex:1}
.hyp .pct{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.meter{height:7px;border-radius:99px;background:#20262e;margin:9px 0 10px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#2f81f7,#58a6ff)}
.hyp.rank1 .meter i{background:linear-gradient(90deg,#f97316,#fbbf24)}
.why{font-size:13px;color:var(--dim);margin-top:8px}
.why b{color:#b9c4d0;font-weight:600}

.mus{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--panel);overflow:hidden}
.mus>summary{padding:14px;cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mus>summary::-webkit-details-marker{display:none}
.mus .mn{font-weight:700;flex:1 1 auto;min-width:0}
.mus .badges{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:6px}
.mus .badges:empty{display:none}
.mus .arrow{color:var(--dim);font-size:13px;margin-left:auto;flex:none}
.mus[open] .arrow{transform:rotate(90deg)}
.mus .body{padding:0 14px 14px;border-top:1px solid var(--line);margin-top:2px;padding-top:12px}
.kv{margin:9px 0;font-size:14px}
.kv b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:2px}
.pri{font-size:11px;padding:3px 7px;border-radius:6px;background:#3b2a12;color:#f0b429;border:1px solid #5a4218}
.pri.confirmed{background:#3a1418;color:#ff8b8b;border-color:#5c2027}

.tbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:none}
.tbl td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dotv{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}

.flag{border:1px solid #6e2a2a;background:#2a1214;border-radius:14px;padding:14px;margin:12px 0}
.flag h3{color:#ff9b9b}
.warnbox{border:1px solid #5a4218;background:#241b0d;border-radius:12px;padding:12px;font-size:13.5px}

.figure{display:block;margin:6px auto 2px;max-width:210px}
.figure .reg{stroke:#2a3038;stroke-width:1.5;transition:fill .3s}
.legend{display:flex;justify-content:center;gap:12px;font-size:11.5px;color:var(--dim);margin-top:4px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}

.step{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.step .n{width:26px;height:26px;flex:none;border-radius:50%;background:var(--panel2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent)}
.step .t{flex:1;font-size:14px}
.step .t b{display:block}
.step .t span{color:var(--dim);font-size:13px}

.hist{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.hbox{flex:none;min-width:112px;padding:11px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.hbox b{display:block;font-size:13px}
.hbox span{font-size:11.5px;color:var(--dim)}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0}
a{color:var(--accent)}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><span class="dot" id="brandDot"></span><span>Pain Mapper</span></div>
    <button class="pill" id="posPill" onclick="openAdjust()">Sitting</button>
    <button class="pill" id="adjPill" onclick="openAdjust()">Adjust</button>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</header>

<main id="app" class="wrap"></main>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div id="toast"></div>

<script>
/* =====================================================================
   MUSCLE / TRIGGER POINT LIBRARY
   Referral patterns follow the standard myofascial trigger point maps
   (Travell & Simons). Every entry: where the muscle is, what it refers,
   how to press it safely, dose, and the stretch that follows.
   ===================================================================== */
const M = {
/* ---------- neck & head ---------- */
upper_trap:{n:"Upper trapezius",area:"neck",
  loc:"The thick ridge running from the side of your neck out to the tip of your shoulder. The main knot sits about halfway along that ridge, in the meaty part you instinctively grab.",
  ref:"Up the side of the neck, behind the ear, and into the temple or behind the eye — the classic 'tension headache' arc. It can also ache into the angle of the jaw.",
  how:"Pincer grip: reach across with the opposite hand, take the whole ridge between thumb and fingers, and lift it away from the neck. Squeeze until you feel a firm ache, then hold still. Tip your head away from that side to shorten the muscle first if it feels too sharp.",
  dose:"Hold each tender spot 30–60 s until the ache drops by about half. 2–3 spots per side, 2–3× a day.",
  stretch:"Sit on your hand to anchor the shoulder. Tip the ear toward the opposite shoulder, then turn your nose toward your armpit. 30 s, 3×.",
  caution:"Squeeze the muscle ridge itself — do not press into the soft front or side of the neck where the pulse is."},
levator:{n:"Levator scapulae",area:"neck",
  loc:"Runs from the top inner corner of the shoulder blade up to the side of the neck. Find the upper inner corner of the shoulder blade and press just above it, angling toward the bone.",
  ref:"The 'crick in the neck' — a sharp ache at the angle where the neck meets the shoulder, often with a hard stop when turning the head to that side.",
  how:"Ball against a wall, or the opposite thumb hooked over the shoulder onto the inner corner of the blade. Rotate your head away from the side you're pressing to expose the attachment.",
  dose:"30–60 s per spot, 2–3× a day. Follow immediately with the stretch or it re-tightens.",
  stretch:"Turn your head 45° away from the tight side, then look down at your pocket. Hand on the back of your head adds light weight. 30 s, 3×.",
  caution:"If turning your head is limited by a hard block rather than by pain, ease off — that pattern belongs to a joint, not the muscle."},
suboccipital:{n:"Suboccipitals",area:"neck",
  loc:"The small deep muscles right where the skull meets the neck — the shelf of bone at the very base of the back of your head, about an inch either side of the midline.",
  ref:"A deep band of headache that wraps from the base of the skull through the head to behind the eye. Feels like the head itself hurts, not the neck.",
  how:"Lie on your back with two tennis balls in a sock, or one ball, tucked right under the base of the skull. Let the head's weight do the work. Small slow nods (chin toward chest) while it presses.",
  dose:"90 s to 3 min total. Very effective for screen and phone headaches. 1–2× a day.",
  stretch:"Chin tuck: pull the chin straight back (make a double chin) without tipping the head. Hold 5 s, 10 reps.",
  caution:"Stop if you get dizzy, visual change, or nausea. Keep pressure on bone-adjacent muscle, never on the throat side."},
scm:{n:"Sternocleidomastoid (SCM)",area:"neck",
  loc:"The rope-like muscle that stands out at the front-side of your neck when you turn your head to the opposite side.",
  ref:"Forehead, above and behind the eye, into the ear and cheek. A big cause of dizziness, 'sinus' pain, and pain that feels like it's inside the head.",
  how:"Turn your head to the opposite side so the rope pops out. Pinch it gently between thumb and index finger — the whole rope, lifted away from the neck — and work slowly from collarbone to ear.",
  dose:"Light pressure only. 20–30 s per level, 3 levels, once a day.",
  stretch:"Tip the ear away, then turn the nose up toward the ceiling on the stretched side. 20 s.",
  caution:"Pinch the muscle only — never press flat into the neck. If you feel a pulse under your fingers, move. Skip entirely if you have carotid disease, a stroke history, or are on blood thinners."},
scalene:{n:"Scalenes",area:"neck",
  loc:"In the hollow just above the collarbone, behind and slightly under the SCM rope.",
  ref:"A wide, confusing spread: front of the chest, the inner edge of the shoulder blade, down the outside of the arm to the thumb and index finger. It is the most common muscular impostor of a pinched nerve.",
  how:"Fingertip pressure, very light, in the hollow above the collarbone. Tip your head toward the same side to soften it first. Press, then slowly tip the head away to add a pin-and-stretch.",
  dose:"15–30 s per spot, gentle. Once a day.",
  stretch:"Anchor the collarbone with the opposite hand, tip the ear away, and turn the nose slightly toward the tight side. 20 s.",
  caution:"The nerves and artery for the whole arm pass here. If pressing causes tingling or shooting into the arm, back off to feather-light or skip. Never press hard behind the collarbone."},
splenius:{n:"Splenius capitis & cervicis",area:"neck",
  loc:"Diagonal band running from the upper back up under the trapezius to the base of the skull, midway between the spine and the shoulder ridge.",
  ref:"Splenius capitis sends pain to the top of the head; splenius cervicis sends it to the back of the skull, into the eye, and to the neck-shoulder angle.",
  how:"Ball against a wall, positioned between the spine and the shoulder blade at neck-base level. Slow head nods while pressing.",
  dose:"45–60 s per spot, 2× a day.",
  stretch:"Turn the head 30° away, then tuck the chin and let the head drop forward. 30 s.",
  caution:"Keep off the bony spine itself."},
masseter:{n:"Masseter",area:"jaw",
  loc:"The jaw muscle at the back corner of your jaw, bulging when you clench your teeth.",
  ref:"Into the lower and upper back teeth, the jaw joint, the ear (including ringing), and up into the eyebrow.",
  how:"Clench once to find it, then relax. Press with 2–3 fingertips outside, or better, pincer it: thumb inside the cheek (clean hands), fingers outside, and squeeze slowly from cheekbone to jaw angle.",
  dose:"30–45 s per spot, 2–3 spots, 2× a day.",
  stretch:"Open slowly with the tongue on the roof of the mouth; hold the widest comfortable point 10 s, 5×.",
  caution:"Go slow — this muscle is very reactive. Skip if the jaw locks or clicks painfully; that needs a dentist or physio."},
temporalis:{n:"Temporalis",area:"jaw",
  loc:"The fan-shaped muscle over the temple, above and in front of the ear. It moves under your fingers when you clench.",
  ref:"Temple headache, into the eyebrow and upper teeth.",
  how:"Small circles with 2 fingertips, working the fan from front to back, then sustained hold on the tenderest point.",
  dose:"60–90 s total, 2× a day.",
  stretch:"Jaw relaxation: teeth apart, tongue on the palate, lips closed — hold 2 min.",
  caution:"Light-to-moderate pressure only."},

/* ---------- shoulder & scapula ---------- */
infraspinatus:{n:"Infraspinatus",area:"shoulder",
  loc:"Flat muscle covering the lower two-thirds of the back of the shoulder blade, below the horizontal ridge you can feel across the blade.",
  ref:"Deep into the FRONT of the shoulder — this is the number-one reason a shoulder hurts in front but the cause sits behind. Also down the outside of the arm and into the hand.",
  how:"Lie on a ball on the floor, or lean into it against a wall or door frame. Roll slowly until you hit the spot that reproduces the front-of-shoulder ache; that confirmation is the point. Then hold still and breathe.",
  dose:"60–90 s per spot, 2–3 spots, 2× a day.",
  stretch:"Cross-body: pull the arm across the chest with the other hand, 30 s. Then sleeper stretch on your side if tolerated.",
  caution:"Stay on the shoulder blade itself; don't grind on the bony ridge."},
supraspinatus:{n:"Supraspinatus",area:"shoulder",
  loc:"In the trough above the horizontal ridge of the shoulder blade, under the upper trapezius. Press down through the trap to find it.",
  ref:"Deep in the shoulder and the outer upper arm, often with a distinct ache at the elbow. Hurts most in the middle of the arc when raising the arm sideways.",
  how:"Fingertips or thumb pressing down and forward into the trough. Or a ball in a corner of a wall.",
  dose:"45–60 s per spot, 2× a day.",
  stretch:"Cross-body reach and a doorway pec stretch to open the space in front.",
  caution:"If raising the arm has become sharply weak rather than just painful, get the cuff checked before loading it."},
subscapularis:{n:"Subscapularis",area:"shoulder",
  loc:"On the underside of the shoulder blade, reachable only from the armpit. Let the arm hang, reach into the back wall of the armpit, and you'll feel a broad sheet on the blade's front face.",
  ref:"Back of the shoulder plus a distinctive band of pain around the wrist. Locks up outward rotation — the top cause of a 'frozen' feeling shoulder.",
  how:"Lie on your back, arm out to the side, elbow bent. With the opposite hand reach into the armpit, fingers curling around the back wall onto the blade. Press gently and hold; slowly rotate the arm outward while holding.",
  dose:"30–60 s per spot, 2–3 spots, once a day. Expect this one to be very tender.",
  stretch:"Doorway external rotation: elbow at your side bent 90°, forearm against the frame, turn your body away. 30 s.",
  caution:"Big nerves and vessels run through the armpit's front and center. Stay on the shoulder blade at the back wall, and stop if you feel tingling."},
teres:{n:"Teres major & minor",area:"shoulder",
  loc:"The rounded bundle along the outer border of the shoulder blade, running toward the armpit.",
  ref:"Teres minor: a focused spot deep in the back of the shoulder. Teres major: back of the shoulder and down the back of the arm.",
  how:"Pincer grip on the fold at the back of the armpit — grab the whole bundle between thumb and fingers and squeeze.",
  dose:"30–45 s, 2× a day.",
  stretch:"Reach the arm overhead and lean away; or cross-body stretch.",
  caution:"None significant."},
pec_minor:{n:"Pectoralis minor",area:"shoulder",
  loc:"Under the pec major, running from the upper ribs to the front bony point of the shoulder (coracoid). Find the bony bump just below the outer end of the collarbone and press down and in from there.",
  ref:"Front of the shoulder, down the inner arm to the ring and little fingers. Tilts the shoulder blade forward, which pinches the shoulder from above.",
  how:"Fingertips or a ball on a wall, pressing at an angle up and under the pec toward the armpit. Let the arm hang relaxed.",
  dose:"45–60 s, 2× a day.",
  stretch:"Doorway stretch with the elbow slightly ABOVE shoulder height, 30 s, 3×.",
  caution:"Nerves to the arm pass under this muscle. If you get tingling in the hand, lighten up or move slightly."},
pec_major:{n:"Pectoralis major",area:"shoulder",
  loc:"The main chest muscle, from the breastbone out to the arm.",
  ref:"Front of the chest, front of the shoulder, and down the inner arm. Left-sided pec trigger points can mimic cardiac pain.",
  how:"Ball on a wall or a doorframe corner, working the fibers from breastbone outward. Also pincer the front fold of the armpit.",
  dose:"45–60 s per line, 2× a day.",
  stretch:"Doorway stretch at three heights: elbow low, at shoulder height, and high. 30 s each.",
  caution:"Chest pain with shortness of breath, sweating, or nausea is a call-for-help situation, not a massage problem."},
rhomboid:{n:"Rhomboids",area:"midback",
  loc:"Between the inner border of the shoulder blade and the spine.",
  ref:"A superficial burning ache along the inner edge of the shoulder blade — exactly where people say 'the knot in my back'.",
  how:"Ball on a wall between blade and spine. Hug yourself first to slide the blade sideways and expose the muscle.",
  dose:"45–60 s per spot, 2× a day.",
  stretch:"Reach both arms forward and round the upper back, pushing the blades apart. 30 s.",
  caution:"If treating here helps for only minutes, the real driver is usually the scalenes or infraspinatus — treat those too."},
serratus_post_sup:{n:"Serratus posterior superior",area:"midback",
  loc:"Underneath the shoulder blade, at its upper inner region.",
  ref:"A deep, hard-to-reach ache 'under the shoulder blade' that also spreads down the back of the arm to the little finger.",
  how:"Reach the arm across your chest to slide the blade outward, then place a ball where the blade used to be and lean into a wall.",
  dose:"60 s per spot, 2× a day.",
  stretch:"Wrap-around: hug yourself, round forward and breathe wide into the upper back. 30 s.",
  caution:"None significant."},
serratus_ant:{n:"Serratus anterior",area:"midback",
  loc:"The finger-like slips along the side of your ribcage, under the armpit.",
  ref:"Side of the chest and the tip of the shoulder blade, with a distinct 'can't get a full breath' feeling and a stitch when running.",
  how:"Side-lying with a ball under the ribs below the armpit, or fingertips walking rib to rib.",
  dose:"30–45 s per rib space, once a day.",
  stretch:"Overhead side-bend reach; deep breathing into the ribs while pressing.",
  caution:"Stay on the muscle over the ribs; keep off breast tissue."},
lat:{n:"Latissimus dorsi",area:"midback",
  loc:"The broad wing from the low back and pelvis up into the armpit. The graspable part is the back fold of the armpit.",
  ref:"A constant ache at the bottom tip of the shoulder blade, wrapping around to the front and down the inner arm to the ring and little fingers.",
  how:"Pincer the back armpit fold. Or side-lying with the arm overhead and a foam roller under the ribs, rolling slowly.",
  dose:"45–60 s per spot, 2× a day.",
  stretch:"Reach overhead, grab the wrist and side-bend away. 30 s, 3×.",
  caution:"None significant."},
thoracic_es:{n:"Thoracic erector spinae",area:"midback",
  loc:"The two long columns running vertically either side of the spine through the mid-back.",
  ref:"Up and down the back along the columns, and often out to the flank and down to the buttock from lower segments.",
  how:"Two balls either side of the spine (never on it) against a wall or floor. Slow up-and-down travel, pausing on tender points.",

/* =====================================================================
   TEST BANK
   pos : which body positions the test works in  (sit / stand / supine / prone / side)
   d   : depth — 1 core, 2 extended, 3 follow-up only (inserted by next())
   ev  : evidence added when the score is HIGH        (weight x score/4)
   evL : evidence added when the score is LOW         (weight x (4-score)/4)
   next: adaptive rule — returns test ids to insert right now
   cf  : this is a palpation test confirming a specific muscle
   ===================================================================== */
const ANY=['sit','stand','supine','prone','side'];
const Q={};
function def(id,o){o.id=id;Q[id]=o;return o}
function defSide(id,o){                       // creates <id>_l and <id>_r
  ['l','r'].forEach(s=>{
    const w=s==='l'?'left':'right', W=s==='l'?'Left':'Right', c=JSON.parse(JSON.stringify({t:o.t,cue:o.cue,note:o.note||'',warn:o.warn||''}));
    const n=Object.assign({},o,{
      t:c.t.replace(/\{S\}/g,W).replace(/\{s\}/g,w),
      cue:c.cue.replace(/\{S\}/g,W).replace(/\{s\}/g,w),
      note:c.note?c.note.replace(/\{s\}/g,w).replace(/\{S\}/g,W):'',
      warn:c.warn||'', side:s.toUpperCase(), base:id});
    if(o.cf) n.cf=o.cf;
    if(o.next) n.next=(sc,S)=>o.next(sc,S,s);
    def(id+'_'+s,n);
  });
}
const sideOf=id=>Q[id]&&Q[id].side?Q[id].side:null;

  ev:{hip_deep:1,lb_neural:.5}});
defSide('hip_palp_gmin',{t:"Press deeper — {s} hip",reg:'hip',pos:ANY,d:2,cf:'glute_min',

  lbl:['Not tender','Very tender'],
  note:"If this reproduces pain running down the outside of your leg, you've found the great sciatica impostor.",
  ev:{hip_glute:1.2}});
def('hip_sit_hard',{t:"Sitting on a hard seat",reg:'hip',pos:ANY,d:2,

/* ---------- 5. NECK ---------- */

defSide('nk_quadrant',{t:"Look up and over — {s}",reg:'neck',pos:['sit','stand'],d:2,

defSide('nk_quadrant_arm',{t:"Into the arm?",reg:'neck',pos:ANY,d:3,

defSide('nk_median',{t:"Arm nerve tension — {s}",reg:'neck',pos:ANY,d:2,

defSide('nk_palp_trap',{t:"Squeeze the {s} shoulder ridge",reg:'neck',pos:ANY,d:1,cf:'upper_trap',

defSide('nk_palp_trap_ref',{t:"Did it go to your head?",reg:'neck',pos:ANY,d:3,spread:'upper_trap',

def('nk_palp_subocc',{t:"Press the base of your skull",reg:'neck',pos:ANY,d:1,cf:'suboccipital',

/* ---------- 6. SHOULDER ---------- */

defSide('sh_arc',{t:"{S} arm out to the side",reg:'shoulder',pos:ANY,d:1,

defSide('sh_arc_top',{t:"The very top",reg:'shoulder',pos:ANY,d:3,

defSide('sh_emptycan',{t:"Thumb-down press — {s}",reg:'shoulder',pos:ANY,d:1,

defSide('sh_cross',{t:"Cross-body reach — {s}",reg:'shoulder',pos:ANY,d:1,

defSide('sh_load',{t:"Hold a weight — {s}",reg:'shoulder',pos:ANY,d:2,

defSide('sh_er90',{t:"Rotate out — {s}",reg:'shoulder',pos:['supine'],d:2,

defSide('sh_palp_infra',{t:"Press the {s} shoulder blade",reg:'shoulder',pos:ANY,d:1,cf:'infraspinatus',

defSide('sh_palp_infra_ref',{t:"Felt in front?",reg:'shoulder',pos:ANY,d:3,spread:'infraspinatus',

defSide('sh_palp_pecminor',{t:"Press under the {s} collarbone",reg:'shoulder',pos:ANY,d:2,cf:'pec_minor',

defSide('sh_palp_subscap',{t:"Press inside the {s} armpit",reg:'shoulder',pos:ANY,d:2,cf:'subscapularis',

/* ---------- 7. MID BACK ---------- */
defSide('mb_twist',{t:"Twist {s} (upper back)",reg:'midback',pos:['sit'],d:1,

def('mb_breath',{t:"Deep breath",reg:'midback',pos:ANY,d:1,

  lbl:['No pain','Sharp pain'],
  ev:{mb_rib:1.3}});
def('mb_slouch_ext',{t:"Slouch, then open up",reg:'midback',pos:['sit'],d:2,

defSide('mb_palp_rhomboid',{t:"Press beside the {s} blade",reg:'midback',pos:ANY,d:1,cf:'rhomboid',

def('kn_stairs',{t:"Going down stairs",reg:'knee',pos:ANY,d:1,

defSide('kn_behind',{t:"Behind the {s} knee",reg:'knee',pos:ANY,d:2,

defSide('ft_pf',{t:"Point the {s} foot",reg:'foot',pos:ANY,d:1,

defSide('ft_invert',{t:"Turn the {s} foot",reg:'foot',pos:ANY,d:2,

defSide('ft_raise',{t:"Heel raise — {s}",reg:'foot',pos:['sit','stand'],d:2,

defSide('ft_palp_arch',{t:"Press the {s} arch",reg:'foot',pos:ANY,d:1,cf:'plantar_intrinsics',

defSide('ft_palp_gastroc',{t:"Press the {s} upper calf",reg:'foot',pos:ANY,d:2,cf:'gastroc',

defSide('ft_palp_shin',{t:"Press beside the {s} shin",reg:'foot',pos:ANY,d:2,cf:'tib_ant',
  cue:"Press into the muscle <b>just outside your {s} shin bone</b>, in the upper half. Hold 10 seconds.",

defSide('hand_phalen',{t:"Wrist press test — {s}",reg:'arm',pos:ANY,d:2,

  ev:{jaw_tmj:1}});

  cue:"Clench once to find the <b>bulge at the back corner of your {s} jaw</b>, relax, then press it firmly with two fingers for 10 seconds.",
  lbl:['Not tender','Very tender'],
  ev:{jaw_tmj:1.1}});
def('jaw_palp_temp',{t:"Press your temples",reg:'jaw',pos:ANY,d:2,cf:'temporalis',
  cue:"Press with fingertips into your <b>temples</b>, above and in front of the ears, and make slow small circles for 15 seconds.",

/* =====================================================================
   ENGINE
   ===================================================================== */
const REGN={neck:"Neck & head",shoulder:"Shoulder",midback:"Mid back",lowback:"Low back",
  hip:"Hip & buttock",knee:"Knee",foot:"Leg & foot",arm:"Arm & hand",jaw:"Jaw",
  flag:"Safety check",scan:"Body scan",cx:"Background",setup:"Setup"};
const SIDED={shoulder:1,hip:1,knee:1,foot:1,arm:1};
const DEFLBL=['None','Mild','Moderate','Strong','Worst'];
const BTNLBL=['None','Mild','Mod','Strong','Worst'];
const SCOL=['var(--s0)','var(--s1)','var(--s2)','var(--s3)','var(--s4)'];
const SHEX=['#16a34a','#84cc16','#eab308','#f97316','#dc2626'];

let S=null;
function newState(){return{
  started:Date.now(),mode:'sit',depth:'standard',
  q:[],i:0,ans:{},notes:{},skipped:{},
  regions:{},sides:{},done:false,offered:{},addedBy:{}
}}

/* ---------- position / side helper questions ---------- */
def('setup_mode',{t:"How are you set up right now?",reg:'setup',pos:ANY,d:1,type:'choice',
  cue:"Some tests only work in one position. You can switch at any time with the <b>Adjust</b> button — I'll re-order the questions around you.",
  opts:[{v:'sit',b:"Sitting or standing",s:"A chair with a bit of space around you"},
        {v:'lie',b:"Lying down",s:"A bed or a mat — you'll roll onto your back, front and side"}]});
Object.keys(SIDED).forEach(reg=>{
  ['l','r'].forEach(s=>{
    const W=s==='l'?'Left':'Right';
    def('side_'+reg+'_'+s,{t:W+" "+REGN[reg].toLowerCase(),reg:'scan',pos:ANY,d:1,sidepick:reg,side:s.toUpperCase(),
      cue:"Rate your <b>"+W.toLowerCase()+"</b> "+REGN[reg].toLowerCase().replace('&','and')+" on its own."});

/* ---------- comment keyword rules: your notes change the questions ---------- */

/* ---------- queue helpers ---------- */
const posOK=q=>{
  const p=q.pos||ANY;
  return S.mode==='sit' ? (p.includes('sit')||p.includes('stand'))
                        : (p.includes('supine')||p.includes('prone')||p.includes('side'));
};
const asked=id=>S.ans[id]!==undefined||S.skipped[id];
const queued=id=>S.q.indexOf(id)>=0;

function push(ids){ids.forEach(id=>{if(Q[id]&&!asked(id)&&!queued(id))S.q.push(id)})}
function insertNow(ids,by){
  let at=S.i+1,n=0;
  ids.forEach(id=>{
    if(!Q[id]||asked(id)||queued(id))return;
    S.q.splice(at++,0,id);if(by)S.addedBy[id]=by;n++;
  });
  return n;
}
// expand a base id into the sides currently in play
function expandSides(id,reg){
  if(Q[id])return [id];
  const act=(reg&&S.sides[reg])?S.sides[reg]:null;
  const out=[];
  ['l','r'].forEach(s=>{
    const cand=id+'_'+s;
    if(!Q[cand])return;
    const r=Q[cand].reg;
    const sides=S.sides[r];
    if(!sides||sides.includes(s.toUpperCase()))out.push(cand);
  });
  return out;
}

/* ---------- region test selection ---------- */
function regionTests(reg){
  const sc=S.regions[reg]||0;
  const maxD=S.depth==='quick'?1:(S.depth==='thorough'?2:(sc>=3?2:1));
  const sides=S.sides[reg]||[null];
  const out=[];
  Object.values(Q).forEach(q=>{
    if(q.reg!==reg||q.d>maxD||q.d===3)return;
    if(q.side&&SIDED[reg]&&!sides.includes(q.side))return;
    out.push(q);
  });
  // movement tests before palpation; keep left/right adjacent
  out.sort((a,b)=>{
    const pa=a.cf||a.spread?1:0, pb=b.cf||b.spread?1:0;
    if(pa!==pb)return pa-pb;
    if(a.d!==b.d)return a.d-b.d;
    return (a.base||a.id).localeCompare(b.base||b.id);
  });
  return out.filter(posOK).map(q=>q.id);
}
function deferredCount(){
  let n=0;
  Object.keys(S.regions).forEach(reg=>{
    if((S.regions[reg]||0)<1)return;
    regionTestsAnyPos(reg).forEach(id=>{if(!asked(id)&&!queued(id)&&!posOK(Q[id]))n++});
  });
  return n;
}
function regionTestsAnyPos(reg){
  const sc=S.regions[reg]||0;
  const maxD=S.depth==='quick'?1:(S.depth==='thorough'?2:(sc>=3?2:1));
  const sides=S.sides[reg]||[null];
  return Object.values(Q).filter(q=>q.reg===reg&&q.d<=maxD&&q.d!==3&&
    !(q.side&&SIDED[reg]&&!sides.includes(q.side))).map(q=>q.id);
}

function buildTestPhase(){
  const regs=Object.keys(S.regions).filter(r=>(S.regions[r]||0)>=1)
    .sort((a,b)=>S.regions[b]-S.regions[a]);
  regs.forEach(r=>push(regionTests(r)));
  push(['end']);
}
def('end',{t:"Done",reg:'setup',pos:ANY,d:1,type:'end'});

/* ---------- answering ---------- */
function answer(v){
  const q=cur();if(!q)return;
  S.ans[q.id]=v;delete S.skipped[q.id];

  if(q.type==='choice'){
    if(q.id==='setup_mode'){S.mode=v==='lie'?'lie':'sit';renderPos()}
    return advance();
  }
  if(q.reg==='scan'&&q.scan){
    S.regions[q.target]=v;
    if(v>=1&&SIDED[q.target])insertNow(['side_'+q.target+'_l','side_'+q.target+'_r']);
    if(q.id==='scan_neck'&&v>=2)insertNow(['scan_jaw']);
  }
  if(q.sidepick){
    const reg=q.sidepick;
    S.sides[reg]=S.sides[reg]||[];
    const lv=S.ans['side_'+reg+'_l'], rv=S.ans['side_'+reg+'_r'];
    if(lv!==undefined&&rv!==undefined){
      const keep=[];
      if(Math.abs(lv-rv)>=2){keep.push(lv>rv?'L':'R')}
      else{if(lv>=1)keep.push('L');if(rv>=1)keep.push('R')}
      S.sides[reg]=keep.length?keep:[lv>=rv?'L':'R'];
    }
  }
  if(q.flag&&v>=3)flash("Noted — I'll flag that in your summary.");

  // adaptive follow-ups
  if(q.next){
    const ids=q.next(v,S)||[];
    const n=insertNow(ids,'your answer');
    if(n)flash("Added "+n+" follow-up "+(n===1?"question":"questions")+" based on that.");
  }
  // a whole region turning out quiet -> stop testing it
  maybePrune(q);
  advance();
}
function maybePrune(q){
  if(!REGN[q.reg]||['scan','cx','flag','setup'].includes(q.reg))return;
  const reg=q.reg;
  const done=Object.keys(S.ans).filter(id=>Q[id]&&Q[id].reg===reg);
  if(done.length<4)return;
  const worst=Math.max(...done.map(id=>S.ans[id]));
  if(worst<=1){
    const drop=S.q.filter((id,ix)=>ix>S.i&&Q[id].reg===reg);
    if(drop.length>=2){
      S.q=S.q.filter((id,ix)=>!(ix>S.i&&Q[id].reg===reg));
      flash("Nothing much showing in the "+REGN[reg].toLowerCase()+" — skipping "+drop.length+" more of those.");
    }
  }
}
function skip(){const q=cur();if(q){S.skipped[q.id]=1;delete S.ans[q.id]}advance()}
function back(){if(S.i>0){S.i--;render()}}
function advance(){
  S.i++;save();
  if(S.i>=S.q.length)push(['end']);
  render();
}
const cur=()=>Q[S.q[S.i]];

/* ---------- notes ---------- */
function saveNote(txt){
  const q=cur();if(!q)return;
  txt=(txt||'').trim();
  if(!txt){delete S.notes[q.id];closeSheet();render();return}
  S.notes[q.id]=txt;
  let added=0,warn='';
  KW.forEach(r=>{
    if(!r.re.test(txt))return;
    if(r.warn)warn=r.warn;
    added+=insertNow(expandAll(r.add),'your note');
  });
  closeSheet();save();render();
  if(warn)flash(warn);
  else if(added)flash("Note saved — added "+added+" question"+(added===1?"":"s")+" to follow that up.");
  else flash("Note saved.");
}
function expandAll(ids){
  const out=[];
  ids.forEach(id=>{
    if(Q[id]){out.push(id);return}
    ['l','r'].forEach(s=>{if(Q[id+'_'+s])out.push(id+'_'+s)});
  });
  return out;
}

/* =====================================================================
   ANALYSIS
   ===================================================================== */
function analyze(){
  const sc={},mx={},cnt={};
  const add=(k,got,max)=>{if(!H[k])return;sc[k]=(sc[k]||0)+got;mx[k]=(mx[k]||0)+max;cnt[k]=(cnt[k]||0)+1};
  Object.keys(S.ans).forEach(id=>{
    const q=Q[id];if(!q)return;const v=S.ans[id];
    if(q.ev) for(const k in q.ev) add(k,q.ev[k]*(v/4),q.ev[k]);
    if(q.evL)for(const k in q.evL)add(k,q.evL[k]*((4-v)/4),q.evL[k]);
  });
  const loud=Object.keys(S.regions).filter(r=>(S.regions[r]||0)>=2).length;
  let list=Object.keys(sc).map(k=>({k,h:H[k],cnt:cnt[k]||0,
    conf:(sc[k]/(mx[k]||1))*(cnt[k]/(cnt[k]+1.5))}))
    .filter(x=>x.h)
    // only report a pattern for a region the user actually reported and tested
    .filter(x=>x.h.area==='general'?loud>=2:(S.regions[x.h.area]||0)>=1)
    // and only when more than a single stray question fed it
    .filter(x=>x.cnt>=2||(S.regions[x.h.area]||0)>=3)
    .sort((a,b)=>b.conf-a.conf);

  if(loud>=3&&(!list[0]||list[0].conf<.45))
    list.push({k:'general_myofascial',h:H.general_myofascial,cnt:loud,conf:.30+loud*.03});
  list=list.filter(x=>x.conf>=.14).slice(0,5);
  if(!list.length&&Object.keys(sc).length){
    const k=Object.keys(sc).sort((a,b)=>sc[b]-sc[a])[0];
    if(H[k])list=[{k,h:H[k],conf:.15}];
  }
  return list;
}

function musclePlan(top){
  const w={},confirmed={},referred={};
  top.forEach((t,i)=>{
    (t.h.mus||[]).forEach((mid,j)=>{
      if(!M[mid])return;
      w[mid]=(w[mid]||0)+t.conf*(1-j*0.09)*(i===0?1.35:1);
    });
  });
  Object.keys(S.ans).forEach(id=>{
    const q=Q[id],v=S.ans[id];if(!q)return;
    if(q.cf&&M[q.cf]&&v>=2){w[q.cf]=(w[q.cf]||0)+0.35+v*0.14;confirmed[q.cf]=Math.max(confirmed[q.cf]||0,v)}
    if(q.spread&&M[q.spread]&&v>=2){w[q.spread]=(w[q.spread]||0)+0.45+v*0.1;referred[q.spread]=v}
  });
  Object.keys(S.regions).forEach(r=>{
    if((S.regions[r]||0)<2)return;
    Object.keys(M).forEach(mid=>{if(M[mid].area===r)w[mid]=(w[mid]||0)+0.06*S.regions[r]});
  });
  return Object.keys(w).map(mid=>({mid,m:M[mid],w:w[mid],
      cf:confirmed[mid]||0,rf:referred[mid]||0}))
    .sort((a,b)=>(b.cf?1:0)-(a.cf?1:0)||b.w-a.w)
    .slice(0,9);
}

function redFlags(){
  const out=[];
  const g=(id,th,txt)=>{if((S.ans[id]||0)>=th)out.push(txt)};
  g('rf_bladder',2,"Bladder, bowel or saddle-area numbness alongside back pain needs <b>same-day emergency assessment</b>. This is the one that cannot wait.");
  g('rf_weak',3,"Genuinely progressive weakness in a limb should be <b>assessed promptly</b>, not worked through.");
  g('rf_systemic',3,"Fever, night sweats or unexplained weight loss with pain needs <b>medical review</b> before self-treatment.");
  g('rf_trauma',3,"Significant trauma means a fracture should be <b>ruled out</b> before loading or massaging the area.");
  g('rf_night',4,"Unrelenting night pain that no position relieves is worth <b>getting checked</b>.");
  return out;
}

function start(){S=newState();S.q=['setup_mode','rf_bladder','rf_weak','rf_systemic','rf_trauma','rf_night'].concat(SCAN.map(x=>x[0]));save();render()}

/* ---------- after the scan: context, then tests ---------- */
const origAdvance=advance;
advance=function(){
  S.i++;

    if(!S.phase2&&Object.keys(S.regions).length>=SCAN.length){
      S.phase2=1;
      const any=Object.values(S.regions).some(v=>v>=1);
      if(!any){S.q.push('end')}
      else{
        push(['cx_rest','cx_sitting','cx_standing','cx_morning','cx_spread']);
        S.phase3pending=1;
      }
    }else if(S.phase3pending){
      S.phase3pending=0;buildTestPhase();
    }else if(!S.offered.switch&&deferredCount()>=3){
      S.offered.switch=1;S.q.push('switch');
    }else S.q.push('end');
  }
  save();render();
};
def('switch',{t:"Change position?",reg:'setup',pos:ANY,d:1,type:'choice',
  cue:"There are more tests I can run if you change position — they cover things the current position can't.",
  opts:[{v:'yes',b:"Yes, I'll switch",s:"Continue with the remaining tests"},
        {v:'no',b:"No, finish here",s:"Go straight to your results"}]});
const _answer=answer;
answer=function(v){
  const q=cur();
  if(q&&q.id==='switch'){
    S.ans[q.id]=v;
    if(v==='yes'){
      S.mode=S.mode==='sit'?'lie':'sit';renderPos();
      S.q=S.q.filter(x=>x!=='end');
      const before=S.q.length;
      Object.keys(S.regions).filter(r=>(S.regions[r]||0)>=1)
        .sort((a,b)=>S.regions[b]-S.regions[a]).forEach(r=>push(regionTests(r)));
      const added=S.q.length-before;
      S.q.push('end');
      flash("Switched to "+(S.mode==='sit'?'sitting':'lying')+" — added "+added+" tests.");
    }
    if(S.q[S.q.length-1]!=='end')S.q.push('end');
    S.i++;save();return render();
  }
  return _answer(v);
};

  '<rect class="reg" x="104" y="310" width="24" height="10" rx="5" fill="'+c('foot')+'"/>'+
  '</svg>'+
  '<div class="legend">'+SHEX.map((h,i)=>'<span><i style="background:'+h+'"></i>'+i+'</span>').join('')+'</div>';
}

/* ---------- results ---------- */
function renderResults(){
  window.scrollTo(0,0);
  $('#toast').classList.remove('show');
  S.done=true;save();
  const top=analyze(), plan=musclePlan(top), flags=redFlags();
  const answered=Object.keys(S.ans).length;
  let h='';

  if(flags.length){
    h+='<div class="flag"><h3>⚠ Stop and get this checked</h3>'+
       flags.map(f=>'<p class="sm">'+f+'</p>').join('')+
       '<p class="xs dim" style="margin-bottom:0">The rest of this report still stands, but deal with the above first.</p></div>';
  }

  h+='<h1>Your results</h1><p class="dim sm">'+answered+' answers · '+
     (S.mode==='sit'?'sitting':'lying')+' · '+new Date().toLocaleString()+'</p>';

  h+='<div class="card">'+figure()+'<table class="tbl">'+
     Object.keys(REGN).filter(r=>S.regions[r]!==undefined&&S.regions[r]>0)
      .sort((a,b)=>S.regions[b]-S.regions[a])
      .map(r=>'<tr><td><span class="dotv" style="background:'+SHEX[S.regions[r]]+'"></span>'+REGN[r]+
        (S.sides[r]&&S.sides[r].length?' <span class="dim xs">('+S.sides[r].map(x=>x==='L'?'left':'right').join(', ')+')</span>':'')+
        '</td><td>'+S.regions[r]+'</td></tr>').join('')+
     '</table></div>';

  h+='<h2>What the pattern looks like</h2>';
  if(!top.length){
    h+='<div class="card sm dim">Not enough signal to call a pattern — most tests came back low. That is genuinely good news. If pain persists, run this again on a bad day, when the provocative tests will show more.</div>';
  }
  top.forEach((t,i)=>{
    const pct=Math.round(Math.min(t.conf*115,97));
    h+='<div class="hyp'+(i===0?' rank1':'')+'"><div class="top"><span class="nm">'+t.h.n+'</span>'+
       '<span class="pct">'+pct+'%</span></div>'+
       '<div class="meter"><i style="width:'+pct+'%"></i></div>'+
       '<div class="sm">'+t.h.sum+'</div>';
    if(t.h.helps)h+='<div class="why"><b>Helps:</b> '+t.h.helps.join(' · ')+'</div>';
    if(t.h.avoid)h+='<div class="why"><b>Ease off:</b> '+t.h.avoid.join(' · ')+'</div>';
    if(t.h.refer)h+='<div class="why" style="color:#f0b429"><b>Worth a professional look:</b> '+t.h.refer+'</div>';
    h+='</div>';
  });

  h+='<h2>Where to massage</h2>'+
     '<p class="sm dim">Ordered by what your answers point at. Muscles marked <span class="pri confirmed">confirmed</span> '+
     'are ones where pressing actually reproduced your pain — start with those.</p>';
  if(!plan.length)h+='<div class="card sm dim">No clear muscular targets came out of this run.</div>';
  plan.forEach((p,i)=>{
    h+='<details class="mus"'+(i<2?' open':'')+'><summary>'+
       '<span class="mn">'+p.m.n+'</span>'+
       '<span class="arrow">▸</span>'+
       '<span class="badges">'+
         (p.cf?'<span class="pri confirmed">confirmed tender</span>':'')+
         (p.rf?'<span class="pri">referred your pain</span>':'')+
       '</span></summary><div class="body">'+
       '<div class="kv"><b>Where it is</b>'+p.m.loc+'</div>'+
       '<div class="kv"><b>Where it sends pain</b>'+p.m.ref+'</div>'+
       '<div class="kv"><b>How to work it</b>'+p.m.how+'</div>'+
       '<div class="kv"><b>How long</b>'+p.m.dose+'</div>'+
       '<div class="kv"><b>Stretch after</b>'+p.m.stretch+'</div>'+
       (p.m.caution?'<div class="warnbox xs" style="margin-top:10px"><b>Caution:</b> '+p.m.caution+'</div>':'')+
       '</div></details>';
  });

  if(plan.length){
    h+='<h2>A 10-minute routine</h2><div class="card">';
    let n=1;
    plan.slice(0,3).forEach(p=>{
      h+='<div class="step"><div class="n">'+(n++)+'</div><div class="t"><b>Press: '+p.m.n+'</b>'+
         '<span>'+p.m.dose+'</span></div></div>';
      h+='<div class="step"><div class="n">'+(n++)+'</div><div class="t"><b>Then stretch it</b>'+
         '<span>'+p.m.stretch+'</span></div></div>';
    });
    if(top[0]&&top[0].h.helps)
      h+='<div class="step"><div class="n">'+(n++)+'</div><div class="t"><b>Then move</b><span>'+top[0].h.helps[0]+'</span></div></div>';
    h+='</div><p class="xs dim">Pressure should feel like a strong but bearable ache — roughly 6 out of 10, never sharp. '+
       'Breathe out as you sink in. Expect mild soreness for a day; sharp or worsening pain means back off.</p>';
  }

  const noteIds=Object.keys(S.notes);
  if(noteIds.length){
    h+='<h2>Your notes</h2><div class="card">'+noteIds.map(id=>
      '<div class="step"><div class="t"><b>'+(Q[id]?Q[id].t:id)+
      (S.ans[id]!==undefined?' <span class="dim">— rated '+S.ans[id]+'</span>':'')+'</b><span>“'+esc(S.notes[id])+'”</span></div></div>').join('')+'</div>';
  }

  const hist=history();
  if(hist.length){
    h+='<h2>Compared with before</h2><div class="hist">'+
      hist.slice(0,6).map(r=>'<div class="hbox"><b>'+new Date(r.t).toLocaleDateString()+'</b>'+
        '<span>'+(r.top||'—')+'</span><span style="color:'+SHEX[Math.min(4,r.worst||0)]+'">worst '+(r.worst||0)+'</span></div>').join('')+
      '</div>';
  }

  h+='<hr class="sep"><div class="row"><button class="btn sm grow" onclick="exportTxt()">Save report</button>'+
     '<button class="btn sm grow" onclick="copyTxt()">Copy</button></div>'+
     '<button class="btn ghost" style="margin-top:10px" onclick="finishAndHome()">Finish</button>'+
     '<div class="warnbox" style="margin-top:16px">This is a self-assessment tool, not a diagnosis. '+
     'Trigger point work is safe for most people but it is not a substitute for assessment when pain is severe, '+
     'spreading, following an injury, or simply not settling over a few weeks.</div>';

  app().innerHTML=h;
  recordHistory(top);
}
function recordHistory(top){
  if(S.recorded)return;S.recorded=true;save();
  const worst=Math.max(0,...Object.values(S.regions).map(Number).filter(n=>!isNaN(n)));
  saveHistory({t:Date.now(),top:top[0]?top[0].h.n:'No clear pattern',worst,
    regions:S.regions,mode:S.mode});
}
function finishAndHome(){localStorage.removeItem(LSK);S=null;renderHome()}

/* ---------- report text ---------- */
function reportText(){
  const top=analyze(),plan=musclePlan(top),flags=redFlags();
  let L=['PAIN MAPPER REPORT','Date: '+new Date().toLocaleString(),
    'Position: '+(S.mode==='sit'?'sitting/standing':'lying down'),
    'Questions answered: '+Object.keys(S.ans).length,''];
  if(flags.length){L.push('!! FLAGGED FOR MEDICAL REVIEW');
    flags.forEach(f=>L.push('  - '+f.replace(/<[^>]+>/g,'')));L.push('')}
  L.push('REGION SCORES (0-4)');
  Object.keys(S.regions).forEach(r=>{if(S.regions[r]>0)
    L.push('  '+(REGN[r]||r).padEnd(16)+S.regions[r]+(S.sides[r]?' ('+S.sides[r].join('/')+')':''))});
  L.push('','LIKELY PATTERNS');
  top.forEach((t,i)=>{L.push('  '+(i+1)+'. '+t.h.n+'  ['+Math.round(t.conf*115)+'%]');
    L.push('     '+t.h.sum);
    if(t.h.helps)L.push('     Helps: '+t.h.helps.join('; '));
    if(t.h.avoid)L.push('     Ease off: '+t.h.avoid.join('; '));});
  L.push('','MASSAGE / TRIGGER POINT TARGETS');
  plan.forEach((p,i)=>{
    L.push('  '+(i+1)+'. '+p.m.n+(p.cf?'   [CONFIRMED TENDER]':'')+(p.rf?'   [REFERRED YOUR PAIN]':''));
    L.push('     Where: '+p.m.loc);
    L.push('     Refers: '+p.m.ref);
    L.push('     Method: '+p.m.how);
    L.push('     Dose: '+p.m.dose);
    L.push('     Stretch: '+p.m.stretch);
    if(p.m.caution)L.push('     CAUTION: '+p.m.caution);
    L.push('');
  });
  L.push('ALL ANSWERS');
  S.q.forEach(id=>{const q=Q[id];if(!q||S.ans[id]===undefined)return;
    if(q.type==='choice'||q.type==='end')return;
    L.push('  ['+S.ans[id]+'] '+q.t+(q.side?' ('+q.side+')':''));
    if(S.notes[id])L.push('       note: '+S.notes[id]);});
  L.push('','Self-assessment only - not a diagnosis.');
  return L.join('\n');
}
function exportTxt(){
  const b=new Blob([reportText()],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='pain-report-'+new Date().toISOString().slice(0,10)+'.txt';
  document.body.appendChild(a);a.click();a.remove();
  flash("Report downloaded.");
}
function copyTxt(){
  const t=reportText();
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(t).then(()=>flash("Report copied."),()=>fallbackCopy(t));
  else fallbackCopy(t);
}
function fallbackCopy(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy');flash("Report copied.")}catch(e){flash("Copy failed — use Save report instead.")}
  ta.remove();
}

/* ---------- sheets ---------- */
function closeSheet(){$('#sheet').classList.remove('open')}
function openSheet(html){$('#sheetInner').innerHTML=html;$('#sheet').classList.add('open')}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});

function openNote(){
  const q=cur();if(!q)return;
  openSheet('<h3>Add a note</h3>'+
    '<p class="xs dim">Describe what you actually felt — where it went, what it felt like, what you were doing. '+
    'I read these: certain words add relevant tests straight away.</p>'+
    '<textarea id="noteBox" placeholder="e.g. sharp on the left, ran down the outside of my leg to the ankle">'+
    esc(S.notes[q.id]||'')+'</textarea>'+
    '<div class="chips">'+['tingling','shooting down my leg','sharp catch','deep ache','only at night',
      'clicking','worse after sitting','burning','numbness','tight not painful']
      .map(c=>'<button class="chip" onclick="addChip(\''+c+'\')">+ '+c+'</button>').join('')+'</div>'+
    '<div class="row" style="margin-top:12px">'+
      '<button class="btn ghost grow" onclick="closeSheet()">Cancel</button>'+
      '<button class="btn primary grow" onclick="saveNote(document.getElementById(\'noteBox\').value)">Save note</button>'+
    '</div>');
  setTimeout(()=>{const b=$('#noteBox');b.focus();b.setSelectionRange(b.value.length,b.value.length)},60);
}
function addChip(c){
  const b=$('#noteBox');b.value=(b.value?b.value.replace(/\s*$/,'')+', ':'')+c;b.focus();
}

function openAdjust(){
  if(!S){flash("Start an assessment first.");return}
  const q=cur();
  const untested=Object.keys(REGN).filter(r=>!['flag','scan','cx','setup'].includes(r)&&!(S.regions[r]>=1));
  openSheet('<h3>Adjust</h3>'+
   '<p class="xs dim">Change things mid-assessment — I re-plan the remaining questions around whatever you pick.</p>'+
   '<div class="kv"><b>Position</b></div><div class="row">'+
     ['sit','lie'].map(m=>'<button class="btn sm grow'+(S.mode===m?' primary':'')+'" onclick="setMode(\''+m+'\')">'+
       (m==='sit'?'Sitting / standing':'Lying down')+'</button>').join('')+'</div>'+
   '<div class="kv" style="margin-top:14px"><b>How thorough</b></div><div class="row">'+
     [['quick','Quick'],['standard','Standard'],['thorough','Thorough']].map(([v,n])=>
       '<button class="btn sm grow'+(S.depth===v?' primary':'')+'" onclick="setDepth(\''+v+'\')">'+n+'</button>').join('')+'</div>'+
   (untested.length?'<div class="kv" style="margin-top:14px"><b>Also test</b></div><div class="chips">'+
     untested.map(r=>'<button class="chip" onclick="addRegion(\''+r+'\')">+ '+REGN[r]+'</button>').join('')+'</div>':'')+
   '<div style="margin-top:14px">'+
     (q&&!['scan','cx','flag','setup'].includes(q.reg)?
       '<button class="btn sm" style="width:100%;margin-bottom:8px" onclick="skipRegion()">Skip the rest of the '+(REGN[q.reg]||'').toLowerCase()+' tests</button>':'')+
     '<button class="btn sm" style="width:100%;margin-bottom:8px" onclick="finishNow()">Finish now and show results</button>'+
     '<button class="btn sm ghost" style="width:100%" onclick="if(confirm(\'Discard this session?\')){localStorage.removeItem(LSK);S=null;closeSheet();renderHome()}">Start over</button>'+
   '</div>');
}
function setMode(m){
  if(S.mode===m){closeSheet();return}
  S.mode=m;
  const before=S.q.length;
  if(S.phase2&&!S.phase3pending){
    Object.keys(S.regions).filter(r=>(S.regions[r]||0)>=1)
      .sort((a,b)=>S.regions[b]-S.regions[a]).forEach(r=>push(regionTests(r)));
    if(S.q[S.q.length-1]!=='end'){S.q=S.q.filter(x=>x!=='end');S.q.push('end')}
  }
  // drop upcoming questions that no longer work in this position
  S.q=S.q.filter((id,ix)=>ix<=S.i||id==='end'||posOK(Q[id]));
  if(S.q[S.q.length-1]!=='end')S.q.push('end');
  // ...including the one currently on screen
  while(cur()&&!cur().type&&!posOK(cur()))S.i++;
  closeSheet();save();renderPos();render();
  const d=S.q.length-before;
  flash("Now in "+(m==='sit'?'sitting':'lying')+" mode"+(d>0?" — "+d+" tests added":"")+".");
}
function setDepth(d){
  S.depth=d;
  if(S.phase2&&!S.phase3pending){
    if(d==='thorough'){
      Object.keys(S.regions).filter(r=>(S.regions[r]||0)>=1).forEach(r=>push(regionTests(r)));
      S.q=S.q.filter(x=>x!=='end');S.q.push('end');
    }else if(d==='quick'){
      S.q=S.q.filter((id,ix)=>ix<=S.i||id==='end'||(Q[id].d||1)<=1);
    }
  }
  closeSheet();save();render();
  flash("Set to "+d+" — "+Math.max(0,S.q.length-S.i-1)+" questions left.");
}
function addRegion(r){
  S.regions[r]=Math.max(S.regions[r]||0,2);
  if(SIDED[r]&&!S.sides[r])S.sides[r]=['L','R'];
  const n=insertNow(regionTests(r),'you');
  closeSheet();save();render();
  flash("Added "+n+" "+REGN[r].toLowerCase()+" tests.");
}
function skipRegion(){
  const q=cur();if(!q)return closeSheet();
  const reg=q.reg,before=S.q.length;
  S.q=S.q.filter((id,ix)=>ix<=S.i||Q[id].reg!==reg);
  S.skipped[q.id]=1;delete S.ans[q.id];
  closeSheet();S.i++;save();render();
  flash("Skipped "+(before-S.q.length)+" "+REGN[reg].toLowerCase()+" questions.");
}
function finishNow(){
  S.q=S.q.slice(0,S.i);S.q.push('end');S.i=S.q.length-1;
  closeSheet();save();render();
}

/* ---------- history ---------- */
function renderHistory(){
  const h=history();
  let s='<h1>History</h1>';
  if(!h.length)s+='<p class="dim">Nothing saved yet.</p>';
  h.forEach(r=>{
    s+='<div class="card"><div class="row"><div class="grow"><b>'+new Date(r.t).toLocaleString()+'</b>'+
       '<div class="sm dim">'+r.top+'</div></div>'+
       '<div style="font-size:26px;font-weight:800;color:'+SHEX[Math.min(4,r.worst||0)]+'">'+(r.worst||0)+'</div></div>'+
       '<table class="tbl">'+Object.keys(r.regions||{}).filter(k=>r.regions[k]>0)
        .sort((a,b)=>r.regions[b]-r.regions[a])
        .map(k=>'<tr><td><span class="dotv" style="background:'+SHEX[r.regions[k]]+'"></span>'+(REGN[k]||k)+'</td><td>'+r.regions[k]+'</td></tr>').join('')+
       '</table></div>';
  });
  s+='<button class="btn ghost" onclick="renderHome()">← Back</button>';
  if(h.length)s+='<button class="btn ghost" style="margin-top:8px;color:#f87171" onclick="if(confirm(\'Delete all saved sessions?\')){localStorage.removeItem(LSH);renderHistory()}">Clear history</button>';
  app().innerHTML=s;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if($('#sheet').classList.contains('open')){if(e.key==='Escape')closeSheet();return}
  if(!S||!cur()||cur().type==='choice'||cur().type==='end')return;
  if(/^[0-4]$/.test(e.key))answer(+e.key);
  else if(e.key==='ArrowLeft')back();
  else if(e.key==='ArrowRight')skip();
  else if(e.key.toLowerCase()==='n')openNote();
});

/* ---------- go ---------- */
renderHome();
</script>
</body>
</html>
