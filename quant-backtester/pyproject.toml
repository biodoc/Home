[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsb"
version = "0.1.0"
description = "Walk-forward backtester for statistical signals on daily equity bars"
readme = "README.md"
requires-python = ">=3.11"

# The floors here are looser than requirements.txt on purpose. requirements.txt
# pins exact, tested versions for a reproducible run; these bounds are what the
# code actually needs, so the package can coexist with a slightly different
# stack if you install it alongside other work.
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
# Downloading is optional: --source csv works from exported files alone.
download = ["yfinance>=0.2.60"]
# Enables cache_format = "parquet". CSV caching needs nothing extra.
parquet = ["pyarrow>=15"]
dev = ["pytest>=8"]
all = ["yfinance>=0.2.60", "pyarrow>=15", "pytest>=8"]

[project.scripts]
qsb-backtest = "qsb.cli:main"

[tool.setuptools]
packages = ["qsb"]

[tool.setuptools.package-data]
qsb = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::RuntimeWarning"]
