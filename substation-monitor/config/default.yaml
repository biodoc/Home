# Substation Wildlife Monitor — default config.
# Classes are config-driven: add one here (plus training data) with no code changes.

site: bench-01                      # home bench test (driveway)

cameras:
  - id: cam1                        # UniFi G4 Bullet, 4MP
    source: data/footage            # folder of exported Protect clips for the POC
    # Live: enable RTSP for the camera in Protect, then paste its URL here:
    # source: rtsp://<cloudkey-ip>:7447/<stream-id>

models:
  wildlife:
    weights: yolo11n.pt             # pretrained COCO to start; swap for fine-tuned weights
    confidence: 0.25
    imgsz: 1280                     # high res helps small animals at substation distances
  # ppe:
  #   weights: models/hardhat.pt
  #   confidence: 0.40

# Monitor class -> labels the model may emit for it. Priority: squirrel > bird > raccoon.
# Pretrained COCO has bird/person/cat/dog but no squirrel/raccoon;
# those need fine-tuning. cat/dog mapped as stand-ins for the POC only.
# Snake deferred past V1 — add back here once it has training data.
classes:
  squirrel: { model: wildlife, labels: [squirrel, cat] }
  bird:     { model: wildlife, labels: [bird] }
  raccoon:  { model: wildlife, labels: [raccoon, dog] }
  person:   { model: wildlife, labels: [person] }

# Intruder detection (V1): person inside the perimeter during off-hours
# for longer than loiter_sec. Not yet used by the pipeline.
security:
  classes: [person]
  off_hours: { start: "19:00", end: "06:00" }   # local time; window may cross midnight
  loiter_sec: 30
  perimeter: {}                     # per camera: cam1: [[x,y], ...] polygon in pixels; empty = whole frame

sampling:
  fps: 2                            # 1–5 fps is plenty for wildlife presence

retention:
  clip_days: 60
